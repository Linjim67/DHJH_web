<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暑期錄影回放</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
        }

        /* 隱藏滾動條但保留滾動功能 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        /* Modal 淡入動畫 */
        .modal-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* PDF 閱讀器外框 */
        .pdf-wrapper {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
        }
    </style>
</head>

<body class="p-6 md:p-10 text-gray-800">

    <div class="max-w-5xl mx-auto">
        <!-- 頁面標題 -->
        <div class="mb-10">
            <h1 class="text-3xl font-bold text-gray-800 flex items-center gap-3">
                <span class="material-symbols-outlined text-indigo-600 text-4xl">smart_display</span>
                暑期錄影回放
            </h1>
            <p class="text-gray-500 mt-2 ml-1">點擊課程，將會自動開啟 YouTube 觀看錄影。</p>
        </div>

        <!-- 錄影清單容器 -->
        <div id="video-container" class="flex flex-col"> </div>
    </div>

    <div id="pdf-modal"
        class="hidden fixed inset-0 z-50 bg-gray-900/60 backdrop-blur-sm flex justify-center items-center opacity-0 transition-opacity duration-300">
        <div
            class="bg-white w-11/12 md:w-4/5 h-[90vh] rounded-[24px] shadow-2xl flex flex-col modal-fade-in overflow-hidden">

            <!-- Modal Header -->
            <div class="flex justify-between items-center px-6 py-4 border-b border-gray-100 bg-gray-50/50">
                <h3 id="modal-title" class="text-xl font-bold text-gray-800 flex items-center gap-2">
                    <span class="material-symbols-outlined text-red-500">picture_as_pdf</span>
                    <span id="modal-title-text">載入中...</span>
                </h3>
                <button id="close-modal-btn"
                    class="p-2 hover:bg-gray-200 rounded-full transition-colors text-gray-500 hover:text-gray-800">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>

            <!-- Modal Body (PDF Viewer) -->
            <div class="flex-1 p-4 bg-gray-100" oncontextmenu="return false;">
                <div class="pdf-wrapper">
                    <!-- 加上 #toolbar=0 防止下載與列印 -->
                    <iframe id="pdf-iframe" src="" class="w-full h-full border-none"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 錄影資料設定區
        // ==========================================
        const videoData = [
            {
                dayTitle: "第一日課程(當時未錄影，之後會補錄)",
                type: "T",
                videos: [
                    { title: "主題1：反應傾向", url: "#" },
                    { title: "主題2：化學計量", url: "#" },
                    { title: ["主題4：基本測量", "主題5：數據處理"], url: "#" }
                ]
            },
            {
                dayTitle: "第二日課程",
                type: "T",
                videos: [
                    { title: "主題6：酸鹼定義", url: "https://youtu.be/vav-C3Mcnk8" },
                    { title: ["主題6：酸鹼定義", "主題7：酸鹼反應"], url: "https://youtu.be/aA7yVC5UjIU" },
                    { title: ["主題9：濃度標定", "主題10：指示劑"], url: "https://youtu.be/AHvhY1RXqcw" }
                ]
            },
            {
                dayTitle: "第三日課程",
                type: "P",
                videos: [
                    { title: "主題11、課程講解", url: "https://youtu.be/ea2cPAw4iYY" },
                    { title: "主題11、操作示範", url: "https://youtu.be/pw4SJv3f6As" },
                    { title: "主題11、實驗縮時", url: "https://youtu.be/kX7Xx5iiQ7w" }
                ]
            },
            {
                dayTitle: "第四日課程",
                type: "T",
                videos: [
                    { title: "主題12：路易士結構", url: "https://youtu.be/-8Cr2uMYWM4" },
                    { title: ["主題13：有機導論", "主題14：燃燒分析", "主題15：生物化學", "主題16：UV-vis"], url: "https://youtu.be/VdftMMY8yXs" },
                    { title: ["主題16：UV-vis", "主題17：氧還平衡", "主題18：氧還計量"], url: "https://youtu.be/vMyQ5DeA3AM" }
                ]
            },
            {
                dayTitle: "第五日課程",
                type: "P",
                videos: [
                    { title: "主題20、課程講解", url: "https://youtu.be/iJTU0Jp2tRQ" },
                    { title: "主題20、操作示範", url: "https://youtu.be/h8CjztOWW6Q" },
                    { title: "主題20、實驗縮時", url: "https://youtu.be/Re_IJAqhTV0" }
                ]
            },
            {
                dayTitle: "第六日課程",
                type: "T",
                videos: [
                    { title: ["主題21：理想氣體", "主題22：氣體反應"], url: "https://youtu.be/8u3Amtnl5k4" },
                    { title: ["主題23：沉澱表", "主題24：速率定律式"], url: "https://youtu.be/zxH5F9m6EUc" },
                    { title: "主題25：基元反應", url: "https://youtu.be/GGM2RVLcU8o" }
                ]
            },
            {
                dayTitle: "第七日課程",
                type: "P",
                videos: [
                    { title: "主題26、課程講解", url: "https://youtu.be/Mfh7iSzunkk" },
                    { title: "主題26、操作示範", url: "https://youtu.be/XzYEy56ImuA" },
                    { title: "主題26、實驗縮時", url: "https://youtu.be/91RKZRq_wtA" }
                ]
            },
            {
                dayTitle: "第八日課程",
                type: "P",
                videos: [
                    { title: "主題27、未知物分析", url: "https://youtu.be/SMOQ18OqVOE" },
                    { title: "主題28、碘鐘交響曲", url: "#" },
                    { title: "主題27, 28、實驗縮時", url: "https://youtu.be/IgCTKCNvBbw" }
                ]
            },
            {
                dayTitle: "實作測驗解析",
                type: "P",
                videos: [
                    { title: "實作考題", pdf: "2026-SP.pdf" },
                    { title: "講解與作答", url: "#" },
                    { title: "實驗縮時", url: "https://youtu.be/_TRa7ChO-2M" }
                ]
            },
            {
                dayTitle: "其餘章節",
                type: "T",
                videos: [
                    { title: "主題3：實驗器材", url: "#" },
                    { title: "主題8：滴定技巧", url: "#" },
                    { title: "主題19：標準電位", url: "#" },
                    { title: "主題29：色層分析", url: "#" }
                ]
            },
        ];

        // ==========================================
        // 畫面渲染邏輯 (自動排版與加上分隔線)
        // ==========================================
        const container = document.getElementById('video-container');

        // ==========================================
        // PDF 檢視器 Modal (與 SummerNotes.html 相同的保護機制)
        // ==========================================
        const pdfModal = document.getElementById('pdf-modal');
        const pdfIframe = document.getElementById('pdf-iframe');
        const pdfModalTitleText = document.getElementById('modal-title-text');
        const pdfCloseModalBtn = document.getElementById('close-modal-btn');

        function openPdfViewer(title, filename) {
            pdfModalTitleText.innerText = title;
            pdfIframe.src = `Assets/${filename}#toolbar=0&navpanes=0`;

            pdfModal.classList.remove('hidden');
            setTimeout(() => pdfModal.classList.remove('opacity-0'), 10);
        }

        pdfCloseModalBtn.addEventListener('click', () => {
            pdfModal.classList.add('opacity-0');
            setTimeout(() => {
                pdfModal.classList.add('hidden');
                pdfIframe.src = ""; // 清空 iframe 以釋放記憶體
            }, 300);
        });

        videoData.forEach((dayData, index) => {

            const isPractical = dayData.type === 'P';

            const theme = isPractical ? {
                titleBorder: 'border-emerald-500',
                borderHover: 'hover:border-emerald-400',
                iconBg: 'bg-emerald-50',
                iconText: 'text-emerald-600',
                iconHoverBg: 'group-hover:bg-emerald-500'
            } : {
                titleBorder: 'border-blue-500',
                borderHover: 'hover:border-blue-400',
                iconBg: 'bg-blue-50',
                iconText: 'text-blue-600',
                iconHoverBg: 'group-hover:bg-blue-500'
            };

            // 1. 建立「天數」的標題區塊
            const daySection = document.createElement('div');
            daySection.className = "mb-2";

            const dayTitle = document.createElement('h2');
            // 💡 標題左側的線條會跟著 T/P 變換顏色
            dayTitle.className = `text-xl font-bold text-gray-700 mb-4 pl-2 border-l-4 ${theme.titleBorder}`;
            dayTitle.innerText = dayData.dayTitle;
            daySection.appendChild(dayTitle);

            // 2. 建立三個錄影的卡片網格 (Grid)
            const gridContainer = document.createElement('div');
            gridContainer.className = "grid grid-cols-1 md:grid-cols-3 gap-4";

            dayData.videos.forEach((video, vIndex) => {
                const isPdf = !!video.pdf;
                // 如果網址是 "#"，代表尚未上傳，呈現灰色不可點擊狀態
                const isAvailable = isPdf || (video.url && video.url !== "#");

                const card = document.createElement(isPdf ? 'div' : 'a');
                if (isPdf) {
                    card.className = `bg-white p-4 rounded-2xl border border-gray-200 ${theme.borderHover} hover:shadow-md transition-all group flex flex-col justify-between cursor-pointer`;
                    card.addEventListener('click', () => openPdfViewer(video.title, video.pdf));
                } else if (isAvailable) {
                    card.href = video.url;
                    card.target = "_blank"; // 點擊在新分頁開啟
                    card.className = `bg-white p-4 rounded-2xl border border-gray-200 ${theme.borderHover} hover:shadow-md transition-all group flex flex-col justify-between cursor-pointer`;
                } else {
                    card.className = "bg-gray-50 p-4 rounded-2xl border border-gray-200 opacity-70 flex flex-col justify-between cursor-not-allowed";
                }

                // 判斷標題是單一字串，還是包含多個章節的陣列
                let titleHtml = '';
                if (Array.isArray(video.title)) {
                    titleHtml = video.title.map(t => `
                            <div class="text-sm font-bold text-gray-800 leading-snug flex items-start gap-1.5">
                                <span>${t}</span>
                            </div>
                        `).join('');
                } else {
                    // 原本的單一標題
                    titleHtml = `<h3 class="text-sm font-bold text-gray-800 leading-snug">${video.title}</h3>`;
                }

                const icon = isPdf ? 'picture_as_pdf' : (isAvailable ? 'play_arrow' : 'hourglass_empty');
                const label = isPdf ? 'PDF' : `Video ${vIndex + 1}`;
                card.innerHTML = `
                        <div class="flex items-start gap-3">
                            <div class="w-10 h-10 rounded-full ${isAvailable ? `${theme.iconBg} ${theme.iconText} ${theme.iconHoverBg} group-hover:text-white` : 'bg-gray-200 text-gray-400'} flex items-center justify-center shrink-0 transition-colors mt-1">
                                <span class="material-symbols-outlined">${icon}</span>
                            </div>
                            <div class="mt-1 flex-1">
                                <div class="text-xs font-semibold text-gray-400 mb-1.5">${label}</div>
                                <div class="flex flex-col gap-1.5">
                                    ${titleHtml}
                                </div>
                            </div>
                        </div>
                    `;
                gridContainer.appendChild(card);
            });

            daySection.appendChild(gridContainer);
            container.appendChild(daySection);

            // 3. 在日與日之間加上「短線分隔」(最後一天不加)
            if (index < videoData.length - 1) {
                const divider = document.createElement('hr');
                divider.className = "my-8 border-gray-200 border-dashed border-t-2";
                container.appendChild(divider);
            }
        });
    </script>
</body>

</html>
