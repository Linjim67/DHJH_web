<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暑期錄影回放</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="p-6 md:p-10 text-gray-800">

    <div class="max-w-5xl mx-auto">
        <div class="mb-10">
            <h1 class="text-3xl font-bold text-gray-800 flex items-center gap-3">
                <span class="material-symbols-outlined text-red-600 text-4xl">smart_display</span>
                暑期錄影回放
            </h1>
            <p class="text-gray-500 mt-2 ml-1">點擊下方課程卡片，將會自動開啟 YouTube 觀看錄影。</p>
        </div>

        <!-- 錄影清單容器 -->
        <div id="video-container" class="flex flex-col">
            <!-- 內容會由 JavaScript 動態生成 -->
        </div>
    </div>

    <script>
        const videoData = [
            {
                dayTitle: "第一日課程",
                videos: [
                    { title: "Ch. 1-1 物質的分類與基本定律", url: "https://youtube.com/watch?v=YOUR_VIDEO_ID_1" },
                    { title: "Ch. 1-2 原子結構與週期表", url: "https://youtube.com/watch?v=YOUR_VIDEO_ID_2" },
                    { title: "Ch. 1-3 化學鍵結", url: "https://youtube.com/watch?v=YOUR_VIDEO_ID_3" }
                ]
            },
            {
                dayTitle: "第二日課程",
                videos: [
                    { title: "Ch. 1-4 熱力學第一定律", url: "https://youtube.com/watch?v=YOUR_VIDEO_ID_4" },
                    { title: "Ch. 1-5 Gibbs 自由能", url: "https://youtube.com/watch?v=YOUR_VIDEO_ID_5" },
                    { title: "Ch. 1-6 反應速率與動力學", url: "https://youtube.com/watch?v=YOUR_VIDEO_ID_6" }
                ]
            },
            {
                dayTitle: "第三日課程",
                videos: [
                    { title: "Ch. 2-1 氣體定律", url: "https://youtube.com/watch?v=YOUR_VIDEO_ID_7" },
                    { title: "Ch. 2-2 溶液與濃度", url: "#" }, // 如果還沒上傳，可以先填 "#"
                    { title: "Ch. 2-3 酸鹼鹽概論", url: "#" }
                ]
            }
        ];

        const container = document.getElementById('video-container');

        videoData.forEach((dayData, index) => {
            // 1. 建立「天數」的標題區塊
            const daySection = document.createElement('div');
            daySection.className = "mb-2";
            
            const dayTitle = document.createElement('h2');
            dayTitle.className = "text-xl font-bold text-gray-700 mb-4 pl-2 border-l-4 border-red-500";
            dayTitle.innerText = dayData.dayTitle;
            daySection.appendChild(dayTitle);

            // 2. 建立三個錄影的卡片網格 (Grid)
            const gridContainer = document.createElement('div');
            gridContainer.className = "grid grid-cols-1 md:grid-cols-3 gap-4";

            dayData.videos.forEach((video, vIndex) => {
                // 如果網址是 "#"，代表尚未上傳，呈現灰色不可點擊狀態
                const isAvailable = video.url && video.url !== "#";
                
                const card = document.createElement('a');
                if (isAvailable) {
                    card.href = video.url;
                    card.target = "_blank"; // 點擊在新分頁開啟
                    card.className = "bg-white p-4 rounded-2xl border border-gray-200 hover:border-red-400 hover:shadow-md transition-all group flex flex-col justify-between cursor-pointer";
                } else {
                    card.className = "bg-gray-50 p-4 rounded-2xl border border-gray-200 opacity-70 flex flex-col justify-between cursor-not-allowed";
                }

                card.innerHTML = `
                    <div class="flex items-start gap-3">
                        <div class="w-10 h-10 rounded-full ${isAvailable ? 'bg-red-50 text-red-500 group-hover:bg-red-500 group-hover:text-white' : 'bg-gray-200 text-gray-400'} flex items-center justify-center shrink-0 transition-colors">
                            <span class="material-symbols-outlined">${isAvailable ? 'play_arrow' : 'hourglass_empty'}</span>
                        </div>
                        <div class="mt-1">
                            <div class="text-xs font-semibold text-gray-400 mb-1">Video ${vIndex + 1}</div>
                            <h3 class="text-sm font-bold text-gray-800 leading-snug">${video.title}</h3>
                        </div>
                    </div>
                `;
                gridContainer.appendChild(card);
            });

            daySection.appendChild(gridContainer);
            container.appendChild(daySection);

            // 3. 在日與日之間加上「短線分隔」(最後一天不加)
            if (index < videoData.length - 1) {
                const divider = document.createElement('hr');
                divider.className = "my-8 border-gray-200 border-dashed border-t-2";
                container.appendChild(divider);
            }
        });
    </script>
</body>
</html>
