<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>估計測驗答案卷</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <!-- 視圖二：等候室區塊 -->
        <section id="waiting_section" class="card hidden" style="max-width: 450px; margin: 10vh auto; padding: 30px 40px;">
            <h2 style="margin-bottom: 15px;">等候開考</h2>
            <div style="margin: 15px 0 0 0;">
                <p style="color: #555; margin-bottom: 8px;">身分驗證成功。</p>
                <p style="color: #555; margin-bottom: 12px;">距離估計測驗開考時間剩餘：</p>
                <h1 id="countdown_timer"
                    style="color: #0056b3; font-size: 3.5rem; font-weight: bold; margin: 0; line-height: 1;">--:--</h1>
            </div>
        </section>

        <!-- 視圖三：測驗區塊 -->
        <section id="exam_section" class="card hidden">
            <header class="system-header">
                <h1>估計測驗作答區</h1>
                <p id="student_info_display"></p>
                <p style="color: var(--text-muted); font-size: 0.95rem;">共 10 題填充題，每題 8 分，滿分 80 分。請直接填入答案，作答完畢後點擊下方「確認交卷」送出，系統不提供逐題檢驗。</p>
            </header>

            <div class="question-group">
                <!--
                <div class="question-group-header">
                    <span>填充題（第 1-10 題）</span>
                </div>
                -->
                
                <div class="question-row">
                    <span class="q-num">1.</span>
                    <input type="text" id="q1" class="fill-in-input numeric-input" inputmode="numeric" maxlength="6" placeholder="請輸入正整數">
                    <span class="score-denominator">/ 8</span>
                </div>

                <div class="question-row">
                    <span class="q-num">2.</span>
                    <input type="text" id="q2" class="fill-in-input numeric-input" inputmode="numeric" maxlength="6" placeholder="請輸入正整數">
                    <span class="score-denominator">/ 8</span>
                </div>

                <div class="question-row">
                    <span class="q-num">3.</span>
                    <input type="text" id="q3" class="fill-in-input" maxlength="20" placeholder="請輸入答案">
                    <span class="score-denominator">/ 8</span>
                </div>

                <div class="question-row">
                    <span class="q-num">4.</span>
                    <input type="text" id="q4" class="fill-in-input numeric-input" inputmode="numeric" maxlength="6" placeholder="請輸入正整數">
                    <span class="score-denominator">/ 8</span>
                </div>

                <div class="question-row">
                    <span class="q-num">5.</span>
                    <input type="text" id="q5" class="fill-in-input numeric-input" inputmode="numeric" maxlength="6" placeholder="請輸入正整數">
                    <span class="score-denominator">/ 8</span>
                </div>

                <div class="question-row">
                    <span class="q-num">6.</span>
                    <input type="text" id="q6" class="fill-in-input numeric-input" inputmode="numeric" maxlength="6" placeholder="請輸入正整數">
                    <span class="score-denominator">/ 8</span>
                </div>

                <div class="question-row">
                    <span class="q-num">7.</span>
                    <input type="text" id="q7" class="fill-in-input" maxlength="20" placeholder="請輸入答案">
                    <span class="score-denominator">/ 8</span>
                </div>

                <div class="question-row">
                    <span class="q-num">8.</span>
                    <input type="text" id="q8" class="fill-in-input" maxlength="20" placeholder="請輸入答案">
                    <span class="score-denominator">/ 8</span>
                </div>

                <div class="question-row">
                    <span class="q-num">9.</span>
                    <input type="text" id="q9" class="fill-in-input numeric-input" inputmode="numeric" maxlength="6" placeholder="請輸入正整數">
                    <span class="score-denominator">/ 8</span>
                </div>

                <div class="question-row">
                    <span class="q-num">10.</span>
                    <input type="text" id="q10" class="fill-in-input numeric-input" inputmode="numeric" maxlength="6" placeholder="請輸入正整數">
                    <span class="score-denominator">/ 8</span>
                </div>
            </div>

            <div class="action-section">
                <button id="submit_btn" class="btn-primary" onclick="submitExam()">確認交卷</button>
                <span id="status_message" class="status-msg"></span>
            </div>
        </section>
    </div>

    <!-- 系統對話框：一般狀態提示 -->
    <div id="alert_modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="alert_title">系統提示</h3>
            <p id="alert_message" style="white-space: pre-line;"></p>
            <div class="modal-actions" style="justify-content: flex-end;">
                <button class="btn-primary" onclick="closeAlertModal()">確定</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>

</html>
